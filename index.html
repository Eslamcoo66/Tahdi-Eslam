<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Eslam Games - تحدي الكورة</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--grass:#155e2b;--grass2:#104a22;--dark:#072611;--line:#41d870;--ink:#fff;--gold:#ffd700;--red:#ff4d4d;--panel:#082b13;--ptext:#e6f7ea;--pline:#2f7d4a;--pfill:#0f4a24}
:root[data-theme="light"]{--grass:#2e7d32;--grass2:#1b5e20;--dark:#1b4332;--line:#2e7d32;--panel:#f2fbf4;--ptext:#0e3d1f;--pline:#41d870;--pfill:#e3f6e8}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{color:var(--ink);font-family:Tajawal,system-ui,sans-serif;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);
 background:repeating-linear-gradient(90deg,var(--grass) 0 56px,var(--grass2) 56px 112px)}
header{background:linear-gradient(180deg, #021207 0%, var(--dark) 100%);border-bottom:3px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;min-height:74px;padding-top:env(safe-area-inset-top,0px)}
.brand-title{font-size:28px;font-weight:900;color:var(--gold);text-shadow:0 0 12px rgba(255,215,0,0.6), 2px 2px 0px #000;letter-spacing:1px;display:flex;align-items:center;gap:8px}
#back{position:absolute;right:12px;bottom:14px;background:none;border:0;color:var(--gold);font-size:32px;line-height:1;cursor:pointer;display:none}
main{flex:1;overflow-y:auto;padding:18px 14px 28px;max-width:560px;width:100%;margin:0 auto}
.menu button{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:75px;margin:0 0 12px;background:var(--dark);color:var(--ink);border:3px solid var(--line);border-radius:18px;font:800 20px Tajawal,sans-serif;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.3)}
.menu button i{font-style:normal;font-size:28px}
.btn{background:var(--dark);color:#fff;border:3px solid var(--line);border-radius:14px;padding:11px 18px;font:800 18px Tajawal,sans-serif;cursor:pointer}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;justify-content:center;align-items:center;margin:12px 0;flex-wrap:wrap}
.status{text-align:center;font-size:22px;font-weight:800;min-height:34px;margin:6px 0 14px}
.xo{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;direction:ltr;max-width:340px;margin:0 auto}
.xo button{aspect-ratio:1;background:var(--dark);border:3px solid var(--line);border-radius:14px;font-size:46px;color:#fff;cursor:pointer;padding:0}
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;direction:ltr;background:var(--dark);border:3px solid var(--line);padding:8px;border-radius:14px;max-width:420px;margin:0 auto}
.c4 button{aspect-ratio:1;border-radius:50%;border:0;background:var(--grass);padding:0;cursor:pointer}
.c4 .r{background:var(--red)}.c4 .y{background:var(--gold)}
.card{background:var(--dark);border:3px solid var(--line);border-radius:22px;min-height:130px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:30px;font-weight:800;padding:16px;margin:10px 0}
.card .lbl{font-size:16px;color:var(--gold);margin-bottom:6px}
.big{font-size:46px;font-weight:800;text-align:center}
.goal{position:relative;height:150px;border:3px solid var(--line);border-bottom:0;border-radius:10px 10px 0 0;margin:10px auto;max-width:360px;background:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.18) 10px 11px);font-size:60px;display:flex;align-items:center;justify-content:center}
.dirs .btn{flex:1;min-width:90px}
.dots{font-size:26px;letter-spacing:4px;text-align:center;min-height:40px}
.sheet .p{display:flex;align-items:center;gap:8px;background:var(--dark);border:3px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:10px}
.sheet .p b{flex:1;font-size:19px}.sheet .p span{font-size:28px;font-weight:800;min-width:44px;text-align:center}
.sheet .p button{width:42px;height:42px;border-radius:50%;border:0;font-size:24px;font-weight:800;background:var(--gold);color:#222;cursor:pointer}
input, select{font:500 18px Tajawal,sans-serif;padding:12px;border-radius:12px;border:3px solid var(--line);background:var(--dark);color:#fff;flex:1;min-width:0}
input::placeholder{color:#b9dcc3}

.panel{background:var(--panel);color:var(--ptext);border-radius:26px;padding:18px;margin-bottom:18px;border:2px solid var(--pline)}
.trow{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ttl{font-size:26px;font-weight:800}
.panel .btn{background:var(--pfill);color:var(--ptext);border:2px solid var(--pline);flex:1}
.panel .btn.g{background:#2e7d32;color:#fff;border-color:#2e7d32}
.panel .btn:disabled{opacity:.45}
.note{text-align:center;font-weight:700;margin:6px 0 0}
.qh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.badge{background:var(--pfill);border:2px solid var(--pline);border-radius:20px;padding:6px 16px;font-weight:800}
.ic{width:52px;height:52px;border-radius:14px;background:#fb8c00;display:flex;align-items:center;justify-content:center;font-size:28px}
.h{border:2px solid var(--pline);background:var(--pfill);border-radius:14px;padding:12px;margin-bottom:8px;font-size:17px;font-weight:700;line-height:1.4}
.path{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:10px 0 16px}
.cl{background:var(--pfill);border:2px solid var(--pline);border-radius:12px;padding:8px 12px;font-weight:800}
.ar{font-size:22px;font-weight:800;color:var(--gold)}
.ask{text-align:center;font-weight:800;font-size:18px;margin:6px 0}
.ans{background:var(--gold);color:#222;border-radius:14px;padding:14px;text-align:center;font-size:24px;font-weight:800;margin:6px 0 12px}
.row2{display:flex;gap:10px}.row2 .wide{flex:1}.row2 .rf{flex:0 0 64px;font-size:26px;padding:8px}
.pcard{min-height:90px;font-size:26px}
.tm{margin-bottom:14px}.tm b{display:block;font-size:20px;margin-bottom:6px}
.pimg{width:100%;max-height:260px;object-fit:contain;border-radius:16px;margin:10px 0;border:3px solid var(--line)}
</style>
</head>
<body>
<header>
  <button id="back" aria-label="رجوع">&#8250;</button>
  <div class="brand-title" id="title">👑 Eslam Games ⚽</div>
</header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const sh=a=>[...a].sort(()=>Math.random()-.5);
let tm=null, soundEnabled=true;

const GAMES=[
 ['🧢','أنا مين (صعب ع سهل)',who],
 ['💰','المزايدة واللاعب المخفي',auction],
 ['🔁','الانتقالات المعقدة',trans],
 ['📸','تحدي الصور المزدوج',imgChallenge],
 ['🔟','سمّي ١٠',topTen],
 ['⚽','إكس أو بالكورة',xo],
 ['🥅','ضربات جزاء',pen],
 ['🔴','كونكت فور',c4],
 ['📋','سكور شيت',score],
 ['⚙️','الإعدادات والتواصل',settings]
];

function home(){
  clearInterval(tm);
  $('#back').style.display='none';
  $('#title').innerHTML='👑 Eslam Games ⚽';
  app.innerHTML='<div class="menu"></div>';
  GAMES.forEach(g=>{
    const b=document.createElement('button');
    b.innerHTML='<i>'+g[0]+'</i><span>'+g[1]+'</span>';
    b.onclick=()=>{
      $('#back').style.display='block';
      $('#title').textContent=g[1];
      g[2]();
    };
    app.firstChild.appendChild(b);
  });
}
$('#back').onclick=home;

function settings(){
  app.innerHTML=`
    <div class="panel">
      <div class="ttl" style="margin-bottom:16px">⚙️ إعدادات اللعبة</div>
      
      <div class="trow">
        <span style="font-weight:800;font-size:18px">🌐 اللغة:</span>
        <select id="langSel" style="max-width:160px"><option value="ar">العربية 🇪🇬</option><option value="en">English (قريباً)</option></select>
      </div>

      <div class="trow">
        <span style="font-weight:800;font-size:18px">🔊 الأصوات:</span>
        <button class="btn" id="sndToggle" style="flex:0 0 120px">${soundEnabled?'مفعل 🔔':'مكتوم 🔕'}</button>
      </div>

      <div class="trow">
        <span style="font-weight:800;font-size:18px">🌙 المظهر:</span>
        <button class="btn" id="themeToggle" style="flex:0 0 120px">تغيير 🌓</button>
      </div>

      <hr style="border:1px solid var(--pline);margin:16px 0">

      <div class="ttl" style="font-size:20px;margin-bottom:10px">📞 اتصل بنا والدعم</div>
      <div class="row" style="gap:10px">
        <a href="https://wa.me/201000000000" target="_blank" class="btn g" style="text-decoration:none;text-align:center;flex:1">💬 واتساب</a>
        <a href="mailto:eslamgames@gmail.com" class="btn" style="text-decoration:none;text-align:center;flex:1">✉ إيميل</a>
      </div>

      <hr style="border:1px solid var(--pline);margin:16px 0">

      <button class="btn" id="clearData" style="width:100%;background:var(--red);color:#fff;border-color:var(--red)">🗑️ إعادة ضبط المسح والحفظ</button>

      <div style="text-align:center;font-weight:700;margin-top:16px;opacity:0.8">
        <p style="margin:4px 0">🎮 Eslam Games v2.5</p>
        <p style="margin:4px 0">تم التطوير خصيصاً للتحديات والشلة ⚽🔥</p>
      </div>
    </div>
  `;

  $('#sndToggle').onclick=()=>{
    soundEnabled=!soundEnabled;
    $('#sndToggle').textContent=soundEnabled?'مفعل 🔔':'مكتوم 🔕';
  };

  $('#themeToggle').onclick=()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    document.documentElement.setAttribute('data-theme', cur==='light'?'dark':'light');
  };

  $('#clearData').onclick=()=>{
    if(confirm('هل تريد مسح البيانات المخزنة وإعادة الضبط؟')){
      localStorage.clear();
      alert('تم مسح البيانات بنجاح!');
      home();
    }
  };
}

const LS=k=>'eg_'+k;
function loadX(k,D){try{JSON.parse(localStorage.getItem(LS(k))||'[]').forEach(x=>{if(x&&x.n&&!D.some(d=>d.n===x.n))D.push(x)})}catch(e){}}

function quiz(D,body,ask,kind){
  if(kind){loadX(kind,D);}
  const resets=[],seen=new Set();
  const next=()=>{let a=D.filter(x=>!seen.has(x.n));if(!a.length){seen.clear();a=D}const x=a[Math.floor(Math.random()*a.length)];seen.add(x.n);return x};
  app.innerHTML='';
  for(let n=1;n<=10;n++){
    let cur=next(),used=false;
    const c=document.createElement('div');c.className='panel';
    c.innerHTML='<div class="qh"><span class="badge">السؤال '+n+'</span><span class="ic">⚽</span></div><div class="qb"></div><div class="ans" hidden></div><div class="row2"><button class="btn wide sa">👁 إظهار الإجابة</button><button class="btn rf" aria-label="لاعب تاني">↻</button></div>';
    const qb=c.querySelector('.qb'),an=c.querySelector('.ans'),sa=c.querySelector('.sa'),rf=c.querySelector('.rf');
    const draw=()=>{qb.innerHTML=(ask?'<p class="ask">'+ask+'</p>':'')+body(cur);an.hidden=true;sa.textContent='👁 إظهار الإجابة'};
    sa.onclick=()=>{an.hidden=!an.hidden;an.textContent='الإجابة: '+cur.n;sa.textContent=an.hidden?'👁 إظهار الإجابة':'إخفاء الإجابة'};
    rf.onclick=()=>{if(used)return;used=true;rf.disabled=true;cur=next();draw()};
    resets.push(()=>{used=false;rf.disabled=false});
    draw();app.appendChild(c);
  }
}

function who(){
  const D=[
   {n:'ليونيل ميسي',h:['سجلت 91 هدفاً في سنة ميلادية واحدة (2012) [صعب]','لبست رقم 30 في بداية مسيرتي ورقم 10 لاحقاً [صعب]','أنا أرجنتيني وفزت بكأس العالم 2022 [سهل]','لعبت معظم مسيرتي في برشلونة وحالياً في إنتر ميامي [سهل]']},
   {n:'كريستيانو رونالدو',h:['بدأت مسيرتي مع سبورتينج لشبونة ولعبت بالقميص 28 [صعب]','سجلت أكثر من 450 هدف مع ريال مدريد [صعب]','أنا هداف المنتخب البرتغالي عبر التاريخ [سهل]','لعبت لمانشستر يونايتد ويوفنتوس والنصر السعودي [سهل]']},
   {n:'محمد صلاح',h:['سجلت 32 هدفاً في أول موسم لي بالدوري الإنجليزي الممتاز [صعب]','لعبت لفيورنتينا وروما في الدوري الإيطالي [صعب]','أنا قائد منتخب مصر ونجم ليفربول [سهل]','يلقبوني بـ "الملك المصري" [سهل]']},
   {n:'كريم بنزيما',h:['فزت بالكرة الذهبية عام 2022 بعد موسم تاريخي [صعب]','بدأت مسيرتي في نادي أولمبيك ليون الفرنسي [صعب]','كنت المهاجم الأساسي لريال مدريد لسنوات طويلة [سهل]','انتقلت لنادي الاتحاد السعودي [سهل]']},
   {n:'عصام الحضري',h:['شاركت في كأس العالم 2018 بعمر 45 سنة كأكبر لاعب تاريخياً [صعب]','خضت تجربة احترافية في نادي سيون السويسري [صعب]','أنا حارس مرمى منتخب مصر والأهلي التاريخي [سهل]','اشتهرت برقصتي فوق العارضة بعد الفوز [سهل]']}
  ];
  quiz(D,x=>sh(x.h).map(t=>'<div class="h">💡 '+t+'</div>').join(''),'','who');
}

function trans(){
  const D=[
   {n:'زلاتان إبراهيموفيتش',c:['مالمو','أياكس','يوفنتوس','إنتر ميلان','برشلونة','ميلان','باريس سان جيرمان','مانشستر يونايتد','لوس أنجلوس جالاكسي','ميلان']},
   {n:'محمد صلاح',c:['المقاولون العرب','بازل','تشيلسي','فيورنتينا (إعارة)','روما','ليفربول']},
   {n:'أنخيل دي ماريا',c:['روزاريو سنترال','بنفيكا','ريال مدريد','مانشستر يونايتد','باريس سان جيرمان','يوفنتوس','بنفيكا']},
   {n:'سامويل إيتو',c:['ريال مدريد','مايوركا','برشلونة','إنتر ميلان','أنجي محج قلعة','تشيلسي','إيفرتون','سامبدوريا','أنتاليا سبور']},
   {n:'حسام حسن',c:['الأهلي','باوك (إعارة)','كزامكس','الأهلي','الزمالك','المصري','الترسانة','الاتحاد السكندري']}
  ];
  quiz(D,x=>'<div class="path">'+x.c.map(t=>'<span class="cl">'+t+'</span>').join('<span class="ar">←</span>')+'</div>','مين اللاعب اللي عدّى بالأندية دي بالترتيب؟','trans');
}

function auction(){
  const POS=['حارس مرمى','مدافع','وسط ملعب','جناح','مهاجم'];
  const DB=[
    [['محمد الشناوي','مصطفى شوبير'],['عصام الحضري','محمد أبو جبل']],
    [['فيرجيل فان دايك','روبن دياز'],['أحمد حجازي','محمد عبد المنعم']],
    [['كيفين دي بروين','جود بيلينجهام'],['إمام عاشور','عبد الله السعيد']],
    [['محمد صلاح','أحمد سيد زيزو'],['فينيسيوس جونيور','لامين يامال']],
    [['كيليان مبابي','إيرلينج هالاند'],['عمر مرموش','مصطفى محمد']]
  ];
  let p1='إسلام', p2='أحمد';
  
  function setup(){
    app.innerHTML='<div class="panel"><div class="ttl" style="margin-bottom:12px">💰 المزايدة وتحدي الملايين</div>'
    +'<div class="row"><input id="p1" value="إسلام" placeholder="المزايد الأول"><input id="p2" value="أحمد" placeholder="المزايد الثاني"></div>'
    +'<button class="btn g" id="st" style="width:100%;margin-top:10px">ابدأ المزايدة (100M لكل لاعب)</button></div>';
    $('#st').onclick=()=>{p1=$('#p1').value\vert{}\vert{}'إسلام';p2=$('#p2').value||'أحمد';play()};
  }

  function play(){
    const B=[100,100], T=[[],[]]; let r=0;
    function rnd(){
      const [visPlayer, hidPlayer]=DB[r][Math.floor(Math.random()*DB[r].length)];
      const pn=document.createElement('div');pn.className='panel';app.innerHTML='';app.appendChild(pn);

      pn.innerHTML='<div class="qh"><span class="badge">الجولة '+(r+1)+' من 5</span><span class="badge">'+POS[r]+'</span></div>'
      +'<div class="card pcard"><span class="lbl">⚽ اللاعب الظاهر للمزايدة:</span>'+visPlayer+'</div>'
      +'<div class="card pcard" style="border-style:dashed;background:rgba(0,0,0,0.2)"><span class="lbl">🔒 اللاعب المخفي (للطرف الآخر):</span>❓❓❓</div>'
      +'<div class="row" style="background:var(--pfill);padding:10px;border-radius:14px;margin:10px 0">'
      +'<div style="flex:1"><b>'+p1+'</b>: '+B[0]+'M</div><div style="flex:1"><b>'+p2+'</b>: '+B[1]+'M</div></div>'
      +'<div class="row"><select id="winSelect" style="padding:10px;font-weight:700;border-radius:10px"><option value="0">الفائز: '+p1+'</option><option value="1">الفائز: '+p2+'</option></select>'
      +'<input type="number" id="buyPrice" placeholder="سعر الشراء (M)" style="max-width:140px">'
      +'<button class="btn g" id="confirmBuy">تاكيد الشراء</button></div>';

      $('#confirmBuy').onclick=()=>{
        const w=+($('#winSelect').value);
        const l=w===0?1:0;
        const pr=+($('#buyPrice').value)||0;
        if(pr>B[w]){alert('المبلغ أكبر من الرصيد المتاح!');return;}
        B[w]-=pr;
        T[w].push({p:visPlayer,pr:pr,pos:POS[r]});
        T[l].push({p:hidPlayer,pr:0,pos:POS[r],hid:true});
        r++;
        r<5?rnd():fin();
      };
    }

    function fin(){
      app.innerHTML='<div class="panel"><div class="ttl">🏁 نتائج المزايدة النهائية</div>'
      +[p1,p2].map((n,i)=>'<div class="tm"><b>👤 '+n+' (الباقي: '+B[i]+'M)</b>'+T[i].map(x=>'<div class="h">'+x.pos+': '+x.p+' '+(x.hid?'(مخفي مجاني)':'(بـ '+x.pr+'M)')+'</div>').join('')+'</div>').join('')
      +'<button class="btn g" id="ag" style="width:100%">جولة جديدة</button></div>';
      $('#ag').onclick=setup;
    }
    rnd();
  }
  setup();
}

function imgChallenge(){
  const P=[
   {n:'محمد صلاح',img:'https://upload.wikimedia.org/wikipedia/commons/c/c1/Mohamed_Salah_2018.jpg'},
   {n:'كريستيانو رونالدو',img:'https://upload.wikimedia.org/wikipedia/commons/8/8c/Cristiano_Ronaldo_2018.jpg'},
   {n:'ليونيل ميسي',img:'https://upload.wikimedia.org/wikipedia/commons/b/b4/Lionel-Messi-Argentina-2022-World-Cup_%28cropped%29.jpg'},
   {n:'كليان مبابي',img:'https://upload.wikimedia.org/wikipedia/commons/5/57/Kylian_Mbapp%C3%A9_2018.jpg'}
  ];
  let cur=sh(P);
  app.innerHTML='<div class="panel"><div class="ttl">📸 تحدي الصور المزدوج</div><p class="note">قول تلميحات لصاحبك عن الصورة اللي قدامك، وهو يقولك تلميحات عن صورته، واللي يحزر الأول يكسب!</p>'
  +'<img class="pimg" src="'+cur[0].img+'"><div class="ans" id="ia" hidden>اللاعب: '+cur[0].n+'</div>'
  +'<div class="row"><button class="btn g" id="shA">كشف الاسم</button><button class="btn" id="nxI">لاعب آخر ↻</button></div></div>';
  $('#shA').onclick=()=>$('#ia').hidden=!$('#ia').hidden;
  $('#nxI').onclick=imgChallenge;
}

function topTen(){
  const T=['أندية مصرية','لاعبين برازيليين','مدربين كبار','ملاعب كورة','منتخبات أفريقية','أندية إنجلترا'];
  let deck=[],c=0,left=60;
  app.innerHTML='<div class="status">سمّي ١٠ في الفئة قبل ما الوقت يخلص</div><div class="big" id="tm">60</div><div class="card" id="cd">جاهز؟</div><div class="big" id="ct">0 / 10</div><div class="row"><button class="btn" id="go">ابدأ</button><button class="btn" id="pl" disabled>+١ إجابة صح</button><button class="btn" id="nx" disabled>فئة تانية</button></div>';
  const nx=()=>{if(!deck.length)deck=sh(T);c=0;$('#ct').textContent='0 / 10';$('#cd').textContent=deck.pop()};
  const end=m=>{clearInterval(tm);$('#cd').textContent=m;$('#pl').disabled=$('#nx').disabled=true;$('#go').disabled=false;$('#go').textContent='جولة جديدة'};
  $('#go').onclick=()=>{left=60;$('#tm').textContent=left;nx();$('#pl').disabled=$('#nx').disabled=false;$('#go').disabled=true;
    tm=setInterval(()=>{left--;$('#tm').textContent=left;if(left<=0)end('الوقت خلص! عملت '+c+' من 10')},1000)};
  $('#pl').onclick=()=>{c++;$('#ct').textContent=c+' / 10';if(c>=10)end('🏆 كملت الـ10!')};
  $('#nx').onclick=nx;
}

function xo(){
  let b=Array(9).fill(''),t='⚽',over=false;
  const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  app.innerHTML='<div class="status" id="st">الدور على: ⚽</div><div class="xo" id="g"></div><div class="row"><button class="btn" id="rs">ماتش جديد</button></div>';
  const st=$('#st'),g=$('#g');
  function draw(){g.innerHTML='';b.forEach((v,i)=>{const c=document.createElement('button');c.textContent=v;
    c.onclick=()=>{if(over||b[i])return;b[i]=t;
      if(L.some(l=>l.every(k=>b[k]===t))){over=true;st.textContent='🏆 الفايز: '+t}
      else if(b.every(Boolean)){over=true;st.textContent='تعادل 🤝'}
      else{t=t==='⚽'?'🥅':'⚽';st.textContent='الدور على: '+t}draw()};g.appendChild(c)})}
  $('#rs').onclick=xo;draw();
}

function pen(){
  const D=['شمال','وسط','يمين'],E=['⬅️','⬆️','➡️'];let n=0,s=0,res=[];
  app.innerHTML='<div class="status" id="st">اختار هتشوط فين — 5 ضربات</div><div class="goal" id="gl">🧤</div><div class="dots" id="ds"></div><div class="row dirs" id="bt"></div><div class="row"><button class="btn" id="rs" style="display:none">ماتش جديد</button></div>';
  D.forEach((d,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=E[i]+' '+d;
    b.onclick=()=>{const k=Math.floor(Math.random()*3),goal=k!==i;n++;if(goal)s++;res.push(goal?'⚽':'❌');
      $('#gl').textContent=goal?'⚽ جووول':'🧤 الحارس صدّها';$('#ds').textContent=res.join(' ');
      if(n===5){$('#st').textContent='النتيجة: '+s+' من 5 '+(s>=4?'🔥':s>=3?'👏':'😅');$('#bt').style.display='none';$('#rs').style.display='inline-block'}
      else $('#st').textContent='الضربة '+(n+1)+' من 5'};$('#bt').appendChild(b)});
  $('#rs').onclick=pen;
}

function c4(){
  const R=6,C=7;let b=Array.from({length:R},()=>Array(C).fill('')),t='r',over=false;const nm={r:'الأحمر',y:'الأصفر'};
  app.innerHTML='<div class="status" id="st">الدور على الأحمر</div><div class="c4" id="g"></div><div class="row"><button class="btn" id="rs">ماتش جديد</button></div>';
  const st=$('#st'),g=$('#g');
  const win=(r,c)=>[[0,1],[1,0],[1,1],[1,-1]].some(([dr,dc])=>{let n=1;for(const s of[1,-1]){let i=r+dr*s,j=c+dc*s;while(b[i]&&b[i][j]===t){n++;i+=dr*s;j+=dc*s}}return n>=4});
  function draw(){g.innerHTML='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){const x=document.createElement('button');x.className=b[r][c];
    x.onclick=()=>{if(over)return;let i=R-1;while(i>=0&&b[i][c])i--;if(i<0)return;b[i][c]=t;
      if(win(i,c)){over=true;st.textContent='🏆 فاز '+nm[t]}else if(b[0].every(Boolean)){over=true;st.textContent='تعادل 🤝'}
      else{t=t==='r'?'y':'r';st.textContent='الدور على '+nm[t]}draw()};g.appendChild(x)}}
  $('#rs').onclick=c4;draw();
}

function score(){
  let P=[];
  app.innerHTML='<div class="row" style="margin-top:0"><input id="nm" placeholder="اسم الفريق أو اللاعب"><button class="btn" id="ad">أضف</button></div><div class="sheet" id="ls"></div><div class="row"><button class="btn" id="z">صفّر النتيجة</button></div>';
  const ls=$('#ls');
  function draw(){ls.innerHTML='';P.forEach(p=>{const d=document.createElement('div');d.className='p';
    d.innerHTML='<b></b><button>+</button><span>'+p.s+'</span><button>&minus;</button>';
    d.firstChild.textContent=p.n;const bs=d.querySelectorAll('button');bs[0].onclick=()=>{p.s++;draw()};bs[1].onclick=()=>{p.s--;draw()};ls.appendChild(d)})}
  const add=()=>{const v=$('#nm').value.trim();if(!v)return;P.push({n:v,s:0});$('#nm').value='';draw()};
  $('#ad').onclick=add;$('#nm').onkeydown=e=>{if(e.key==='Enter')add()};$('#z').onclick=()=>{P.forEach(p=>p.s=0);draw()};
}

// تشغيل الشاشة الرئيسية تلقائياً
home();
</script>
